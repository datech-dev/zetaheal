name: Build Android APK - Zeta Heal Caregiver

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android-apk:
    name: Build Zeta Heal Caregiver APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Shared Packages
        run: |
          npm run build:packages

      - name: Generate Android Native Project via Expo Prebuild
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Make Gradlew Executable
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew

      - name: Build Android Debug APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p output
          find apps/mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} output/zetaheal-caregiver.apk \;
          ls -lh output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetaheal-caregiver-apk
          path: output/zetaheal-caregiver.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: caregiver-mobile-v1.0.0
          name: "Zeta Heal Caregiver Android App v1.0.0"
          body: |
            ### 📱 Zeta Heal Caregiver Companion App (Android APK)

            Direct download of the standalone `.apk` package for the Zeta Heal Pediatric OT Caregiver mobile application.

            #### Features:
            - **Activity Plans**: Detailed clinical instructions, materials, and safety guidelines.
            - **One-Tap Completion Logging**: Log sessions with qualitative observations.
            - **Bilingual Interface**: English and Tamil (தமிழ்).
            - **Idempotency & Caregiver Affirmations**: Positive, non-stigmatizing encouragement.

            #### How to Install on Android:
            1. Download `zetaheal-caregiver.apk` below directly onto your Android device.
            2. Tap the notification or open your **Downloads** folder.
            3. Tap **Install** (if prompted, enable "Install unknown apps" in Settings).
            4. Open **Zeta Heal Caregiver** from your home screen.
          files: output/zetaheal-caregiver.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
