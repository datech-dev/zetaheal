name: Build Android APK - Zeta Heal Caregiver

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android-apk:
    name: Build Zeta Heal Caregiver APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and Node Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NODE_PATH=$GITHUB_WORKSPACE/node_modules:$GITHUB_WORKSPACE/apps/mobile/node_modules" >> $GITHUB_ENV

      - name: Install Monorepo Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Shared Packages
        run: |
          npm run build:packages

      - name: Ensure Node Modules Symlinks for Expo Prebuild
        run: |
          ln -sfn "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/apps/mobile/node_modules"

      - name: Generate Android Native Project via Expo Prebuild
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Ensure Node Modules Symlinks for Android Gradle Build
        run: |
          ln -sfn "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/apps/mobile/node_modules"
          ln -sfn "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/apps/mobile/android/node_modules"

      - name: Build Android Debug APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m" --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Print Gradle Log Tail on Failure
        if: failure()
        run: |
          echo "=== GRADLE FAILURE LOG TAIL ==="
          tail -n 120 apps/mobile/gradle-build.log || true
          mkdir -p ci-logs
          tail -n 120 apps/mobile/gradle-build.log > ci-logs/gradle-error.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ci-logs/gradle-error.txt
          git commit -m "ci: capture gradle build error" || true
          git push origin main || true

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: apps/mobile/gradle-build.log

      - name: Prepare APK Output
        run: |
          mkdir -p output
          APK_FILE=$(find apps/mobile/android -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found!"
            exit 1
          fi
          cp "$APK_FILE" output/zetaheal-caregiver.apk
          ls -lh output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetaheal-caregiver-apk
          path: output/zetaheal-caregiver.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: caregiver-mobile-v1.0.0
          name: "Zeta Heal Caregiver Android App v1.0.0"
          body: |
            ### 📱 Zeta Heal Caregiver Companion App (Android APK)

            Standalone `.apk` package for the Zeta Heal Pediatric OT Caregiver mobile application.

            #### How to Install on Android:
            1. Download `zetaheal-caregiver.apk` below directly to your Android device.
            2. Tap the downloaded file in your **Downloads** folder or notification bar.
            3. Tap **Install** (if prompted, allow "Install unknown apps").
            4. Launch **Zeta Heal Caregiver** from your home screen!
          files: output/zetaheal-caregiver.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
